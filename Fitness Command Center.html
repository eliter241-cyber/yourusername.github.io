<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Fitness Command Center</title>
<style>
:root{--bg:#eceff4;--cd:#fff;--tx:#0f1b2d;--mu:#617089;--ln:#d9dfe9;--ac:#1f6bff;--ac2:#e4edff;--ok:#12a56b;--rs:#8a5cf6;--bad:#e0564a;--sh:0 1px 2px #0f1b2d14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111e;--cd:#121b2e;--tx:#e8eefb;--mu:#8d9bb5;--ln:#223049;--ac:#4d8bff;--ac2:#172a50;--sh:none}}
:root[data-theme="dark"]{--bg:#0a111e;--cd:#121b2e;--tx:#e8eefb;--mu:#8d9bb5;--ln:#223049;--ac:#4d8bff;--ac2:#172a50;--sh:none}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;overflow-x:auto;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 66px;border:0;background:none;padding:8px 4px;color:var(--mu);font-size:11px;cursor:pointer;display:grid;gap:2px;justify-items:center}
nav button b{font-size:18px;line-height:1}nav button.on{color:var(--ac);font-weight:700}
main{flex:1;min-width:0;padding:16px 14px 96px;max-width:980px;margin:0 auto;width:100%}
.ph{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}.grid .card{margin:0}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}.stat small,small{color:var(--mu);display:block}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--tx);color:var(--bg);border:0}
.hero small{color:inherit;opacity:.7}.hero h1{font-size:clamp(48px,14vw,84px);font-weight:900;font-style:italic;letter-spacing:-.04em;line-height:.95;margin:6px 0}
.hero .ring text{fill:var(--bg)}.hero .ring circle:first-child{stroke:#ffffff26}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
.btn{border:1px solid var(--ln);background:var(--cd);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:42px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.gh{background:none}.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}.btn.lg{padding:14px 22px;font-size:17px}.btn.bad{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible,.cell:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item .grow,.grow{flex:1;min-width:0}.item b{display:block}.chev{color:var(--mu);font-size:20px}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--mu);flex:none}
.dot.completed{background:var(--ok)}.dot.rest{background:var(--rs)}.dot.skipped{background:var(--bad)}.dot.planned{background:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:18px 8px}.center{text-align:center}.big{font-size:44px;font-weight:900;font-style:italic;letter-spacing:-.03em}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--ac2);color:var(--ac)}
label.f{display:grid;gap:4px;font-weight:600;font-size:13px;margin-bottom:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);min-height:42px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--ac)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chk{display:flex;gap:6px;align-items:center;font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
#m{position:fixed;inset:0;background:#050b16aa;z-index:20;display:flex;align-items:flex-end;justify-content:center}#m[hidden]{display:none}
.sheet{background:var(--cd);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;animation:up .2s}
@media(min-width:700px){#m{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.err{color:var(--bad);font-weight:600;min-height:20px}
.timer{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;text-align:center}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.set{cursor:pointer}.set input{position:absolute;opacity:0}
.set span{display:block;padding:8px 14px;border:1px solid var(--ln);border-radius:10px;font-weight:600}
.set input:checked+span{background:var(--ok);border-color:var(--ok);color:#fff}.set input:focus-visible+span{outline:3px solid var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>div{text-align:center;color:var(--mu);font-size:12px;font-weight:700}
.cell{aspect-ratio:1;border:1px solid var(--ln);border-radius:8px;background:var(--cd);cursor:pointer;display:grid;place-items:center;align-content:center;padding:0}
.cell b{font-size:12px;font-weight:600}.cell span{font-weight:800;font-size:14px}.cell.completed{background:var(--ok);color:#fff}.cell.rest{background:var(--rs);color:#fff}.cell.skipped{background:var(--bad);color:#fff}.cell.now{outline:2px solid var(--ac)}
.chart{width:100%;height:auto;display:block}.ring{flex:none}
#toast{position:fixed;left:12px;right:12px;bottom:84px;z-index:30;display:grid;gap:8px;max-width:520px;margin:auto}
#toast div{background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;display:flex;justify-content:space-between;gap:10px}
#toast button{background:none;border:0;color:inherit;font-weight:800;cursor:pointer}
.pr{background:var(--ac2);color:var(--ac);border-radius:10px;padding:8px 12px;font-weight:700;margin-bottom:6px}
@media(min-width:900px){nav{position:sticky;top:0;height:100vh;flex-direction:column;width:210px;flex:none;border-top:0;border-right:1px solid var(--ln);padding:16px 10px;overflow:auto}
nav button{flex:none;grid-auto-flow:column;justify-content:start;gap:12px;font-size:15px;padding:11px 12px;border-radius:10px}nav button.on{background:var(--ac2)}
main{padding:28px 28px 40px}.grid{grid-template-columns:repeat(4,1fr)}#toast{bottom:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><nav id="nav" aria-label="Main"></nav><main id="main"></main></div><div id="m" hidden></div><div id="toast" aria-live="polite"></div>
<script>
const K='fitcc.v1',CATS=['Cardio','Chest','Back','Arms','Shoulders','Legs','Core','Mobility','Other'],DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],SYM={completed:'✓',rest:'R',skipped:'×',planned:'—'};
const MSG=['Showing up counts more than showing off.','Small sessions add up to big changes.','Rest is part of the plan, not a break from it.','Beat yesterday by a little, not a lot.','Consistency builds the base everything else sits on.','Do today\'s work, then let tomorrow be tomorrow.'];
const dflt=()=>({settings:{name:'',units:'metric',theme:'system',week:1},days:{},exercises:[],reminders:[],goals:[],plan:{},records:[],session:null});
let S=dflt();try{const r=JSON.parse(localStorage.getItem(K)||'null');if(r&&typeof r==='object'){S=Object.assign(dflt(),r);S.settings=Object.assign(dflt().settings,r.settings)}}catch(e){}
const UI={v:'dash',q:'',cat:'',cm:null,pe:''};let AFTER=null,PEND=null,BACK=null;
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>iso(new Date()),addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)},uid=()=>Math.random().toString(36).slice(2,9),cap=s=>s[0].toUpperCase()+s.slice(1);
const fdate=d=>parse(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save: browser storage is unavailable.')}};
function toast(m,sticky){const t=document.createElement('div');t.innerHTML='<span>'+esc(m)+'</span><button aria-label="Dismiss">✕</button>';t.querySelector('button').onclick=()=>t.remove();$('#toast').appendChild(t);if(!sticky)setTimeout(()=>t.remove(),3500)}
const du=()=>S.settings.units==='metric'?'km':'mi';
const fmtD=s=>s>=60?(+(s/60).toFixed(1))+' min':s+' sec';
const cnt=e=>Math.max(+e.sets||0,1);
const desc=e=>[e.sets&&e.reps?e.sets+' × '+e.reps+' reps':e.sets?e.sets+' sets':e.reps?e.reps+' reps':'',e.dur?fmtD(e.dur):'',e.dist?e.dist+' '+du():''].filter(Boolean).join(' · ')||'—';
const blank=()=>({status:'planned',duration:0,exercises:[],notes:'',rpe:'',feeling:'',ach:''});
function ent(d){if(!S.days[d]){S.days[d]=blank();S.days[d]._tmp=1}return S.days[d]}
const done=()=>Object.keys(S.days).filter(d=>S.days[d].status==='completed').sort(),dayNo=d=>done().indexOf(d)+1;
const lbl=d=>{const e=S.days[d];return e.status==='completed'?'Day '+dayNo(d):{rest:'Rest day',skipped:'Skipped',planned:'Planned'}[e.status]};
const wkStart=d=>{const x=parse(d);x.setDate(x.getDate()-(x.getDay()-S.settings.week+7)%7);return iso(x)};
const hm=m=>m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m';
function streak(){const ok=x=>S.days[x]&&(S.days[x].status==='completed'||S.days[x].status==='rest');let d=today();if(!ok(d))d=addD(d,-1);let n=0;while(ok(d)){n++;d=addD(d,-1)}return n}
function runs(){const k=Object.keys(S.days).filter(d=>S.days[d].status==='completed'||S.days[d].status==='rest').sort(),r=[];let c=0,p=null;k.forEach(d=>{if(p&&addD(p,1)===d)c++;else{if(c)r.push(c);c=1}p=d});if(c)r.push(c);return r}
function allEx(){const r=[];done().forEach(d=>S.days[d].exercises.forEach(e=>r.push(Object.assign({},e,{date:d}))));return r}
const sess=e=>(+e.sets||1)*(+e.reps||0);
function bests(){const b={};allEx().forEach(e=>{const o=b[e.name.toLowerCase()]=b[e.name.toLowerCase()]||{name:e.name};[['reps',sess(e)],['dur',+e.dur||0],['dist',+e.dist||0]].forEach(p=>{if(p[1]>(o[p[0]]?o[p[0]].v:0))o[p[0]]={v:p[1],date:e.date}})});return b}
function recs(){const o=[];Object.values(bests()).forEach(b=>{if(b.reps)o.push({k:b.name+'|r',t:b.name+' · most reps in one session',n:b.reps.v,f:b.reps.v+' reps',d:b.reps.date});if(b.dur)o.push({k:b.name+'|d',t:b.name+' · longest hold/duration',n:b.dur.v,f:fmtD(b.dur.v),d:b.dur.date});if(b.dist)o.push({k:b.name+'|x',t:b.name+' · farthest',n:b.dist.v,f:b.dist.v+' '+du(),d:b.dist.date})});
const wm={};done().forEach(d=>{const k=wkStart(d);wm[k]=(wm[k]||0)+(+S.days[d].duration||0)});const w=Object.entries(wm).sort((a,b)=>b[1]-a[1])[0];if(w&&w[1])o.push({k:'week',t:'Most workout minutes in a week',n:w[1],f:w[1]+' min',d:w[0]});return o}
function stats(name){const k=name.toLowerCase(),l=allEx().filter(e=>e.name.toLowerCase()===k).sort((a,b)=>a.date<b.date?-1:1);let r=0,t=0;l.forEach(e=>{r+=sess(e);t+=(+e.sets||1)*(+e.dur||0)});const b=bests()[k]||{};return{n:l.length,last:l[l.length-1],r:r,t:t,b:b}}
function gProg(g){const ds=done().filter(d=>d>=g.created&&(!g.deadline||d<=g.deadline));if(g.type==='workouts')return ds.length;if(g.type==='minutes')return ds.reduce((a,d)=>a+(+S.days[d].duration||0),0);if(g.type==='best'){let b=0;allEx().filter(e=>e.name.toLowerCase()===(g.ex||'').toLowerCase()&&e.date>=g.created).forEach(e=>{const v=g.metric==='reps'?(+e.reps||0):g.metric==='dur'?(+e.dur||0):(+e.dist||0);if(v>b)b=v});return b}return +g.cur||0}
const GU={workouts:'workouts',minutes:'minutes',best:'',manual:''};
// ---------- UI helpers
function modal(h){const m=$('#m');m.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+h+'</div>';m.hidden=false;const f=m.querySelector('input:not([type=checkbox]),select,textarea');if(f&&!f.value)f.focus()}
function closeM(){$('#m').hidden=true;$('#m').innerHTML='';Object.keys(S.days).forEach(d=>{if(S.days[d]._tmp)delete S.days[d]});save();render()}
function ask(msg,fn,back){PEND=fn;BACK=back||closeM;modal('<h2>Are you sure?</h2><p style="margin:10px 0">'+esc(msg)+'</p><div class="acts"><button class="btn bad" data-a="yes">Yes, continue</button><button class="btn" data-a="no">Cancel</button></div>')}
const fld=(l,h)=>'<label class="f">'+l+h+'</label>';
const opts=(a,v)=>a.map(x=>'<option '+(String(x)===String(v)?'selected':'')+'>'+esc(x)+'</option>').join('');
const empty=(t,s)=>'<div class="empty"><b>'+t+'</b><br>'+(s||'')+'</div>';
function bars(d,u){const mx=Math.max.apply(null,d.map(x=>x.v).concat([1])),w=300/d.length;return '<svg class="chart" viewBox="0 0 300 120" role="img">'+d.map((x,i)=>{const h=x.v/mx*76,X=i*w+3,bw=Math.max(w-6,2);return '<rect x="'+X+'" y="'+(98-h)+'" width="'+bw+'" height="'+h+'" rx="3" fill="var(--ac)"><title>'+esc(x.l)+': '+x.v+(u||'')+'</title></rect><text x="'+(X+bw/2)+'" y="112" text-anchor="middle" font-size="8" fill="var(--mu)">'+esc(x.l)+'</text>'+(x.v?'<text x="'+(X+bw/2)+'" y="'+(94-h)+'" text-anchor="middle" font-size="8" fill="var(--tx)">'+x.v+'</text>':'')}).join('')+'</svg>'}
const ring=p=>'<svg class="ring" width="108" height="108" viewBox="0 0 120 120" role="img" aria-label="'+p+' percent"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--ln)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--ac)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(326.7*p/100)+' 326.7" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" font-size="24" font-weight="800" fill="var(--tx)">'+p+'%</text></svg>';
const row=d=>{const e=S.days[d];return '<button class="item" data-a="day" data-d="'+d+'"><span class="dot '+e.status+'">'+SYM[e.status]+'</span><span class="grow"><b>'+lbl(d)+'</b><small>'+fdate(d)+(e.status==='completed'?' · '+(e.duration||0)+' min · '+e.exercises.length+' exercises':'')+'</small></span><span class="chev">›</span></button>'};
// ---------- views
const V={};
V.dash=()=>{const t=today(),te=S.days[t],n=done().length,dT=te&&te.status==='completed',ex=te&&!dT?te.exercises:[];
const tot=ex.reduce((a,e)=>a+cnt(e),0),dn=ex.reduce((a,e)=>a+Math.min(e.ds||0,cnt(e)),0),p=tot?Math.round(dn/tot*100):0;
const ws=wkStart(t),wk=Object.keys(S.days).filter(d=>wkStart(d)===ws),wc=wk.filter(d=>S.days[d].status==='completed').length,wr=wk.filter(d=>S.days[d].status==='rest').length;
const pl=Object.keys(S.plan).filter(k=>S.plan[k]&&!/^rest$/i.test(S.plan[k].trim())).length,last=done().slice(-1)[0],ms=[7,14,30,60,100,200,365,1000].find(x=>x>n),st=streak(),mn=done().reduce((a,d)=>a+(+S.days[d].duration||0),0);
let np=null;for(let i=dT?1:0;i<8&&!np;i++){const d=addD(t,i),x=(S.plan[parse(d).getDay()]||'').trim();if(x)np={d:d,x:x}}
const nm=S.settings.name?esc(S.settings.name)+' · ':'';
const exl=te&&te.exercises.length?te.exercises.map(e=>'<div class="item" style="cursor:default"><span class="grow"><b>'+esc(e.name)+'</b><small>'+esc(e.cat)+' · '+desc(e)+'</small></span></div>').join(''):empty('Add your first exercise.','Log what you plan to do today, or start a session.');
return '<section class="card hero"><div><small>'+nm+fdate(t)+'</small><h1>DAY '+(n+1)+'</h1><p>'+(dT?'Day '+n+' is done today. Day '+(n+1)+' is next.':n?'Today\'s workout':'Ready to begin?')+'</p><p style="margin-top:8px;font-weight:700">'+(st?'🔥 '+st+'-day streak':'No streak yet')+'</p></div>'+ring(p)+'</section>'+
'<p class="center" style="color:var(--mu);margin:0 0 12px">'+MSG[(n+new Date().getDate())%MSG.length]+'</p>'+
'<div class="card"><div class="between"><h3>Today\'s workout</h3>'+(te?'<span class="tag">'+cap(te.status)+'</span>':'')+'</div>'+exl+'<div class="acts"><button class="btn pri" data-a="addex" data-d="'+t+'">+ Add Exercise</button><button class="btn pri" data-a="start">▶ Start Workout</button><button class="btn" data-a="rest">Mark rest day</button></div></div>'+
'<div class="grid"><div class="card stat"><b>'+n+'</b><small>Total workout days</small></div><div class="card stat"><b>'+hm(mn)+'</b><small>Total workout time</small></div><div class="card stat"><b>'+allEx().length+'</b><small>Exercises completed</small></div><div class="card stat"><b>'+Object.values(S.days).filter(e=>e.status==='rest').length+'</b><small>Rest days</small></div></div>'+
'<div class="card" style="margin-top:12px"><div class="between"><h3>This week</h3><span>'+wc+(pl?' / '+pl+' planned':'')+' workouts · '+wr+' rest</span></div><div class="bar"><i style="width:'+Math.min(100,pl?wc/pl*100:wc/7*100)+'%"></i></div></div>'+
'<div class="card"><div class="between"><h3>Overall progress</h3><span>'+n+' / '+ms+' days</span></div><div class="bar"><i style="width:'+n/ms*100+'%"></i></div><small style="margin-top:6px">Next milestone: Day '+ms+'</small></div>'+
'<div class="grid" style="grid-template-columns:1fr"><div class="card"><small>Last workout</small>'+(last?'<b>Day '+dayNo(last)+' · '+fdate(last)+'</b><small>'+(S.days[last].duration||0)+' min · '+S.days[last].exercises.length+' exercises</small>':'<b>No workouts yet.</b>')+'</div><div class="card"><small>Next planned workout</small>'+(np?'<b>'+esc(np.x)+'</b><small>'+fdate(np.d)+'</small>':'<b>Nothing planned</b><small>Set one in Calendar → Weekly plan</small>')+'</div></div>'};
V.workout=()=>{const s=S.session;if(!s)return '<h1 class="ph">Workout</h1><div class="card center"><p class="big">Day '+(done().length+1)+'</p><p style="color:var(--mu);margin:6px 0 14px">Start a timed session. Exercises you add are saved to today.</p><button class="btn pri lg" data-a="start">▶ Start Workout</button></div>';
const e=S.days[s.date];return '<h1 class="ph">Day '+(done().length+(e.status==='completed'?0:1))+' session</h1><div class="card"><div class="timer" id="tm">'+clock(el())+'</div><div class="acts" style="justify-content:center"><button class="btn" data-a="pause">'+(s.since?'⏸ Pause':'▶ Resume')+'</button><button class="btn pri" data-a="finish">Finish workout</button><button class="btn bad" data-a="cancelS">Discard</button></div></div>'+
(e.exercises.length?e.exercises.map(x=>'<div class="card"><div class="between"><div><b>'+esc(x.name)+'</b><small>'+desc(x)+'</small></div><button class="btn sm gh" data-a="editex" data-d="'+s.date+'" data-id="'+x.id+'">Edit</button></div><div class="sets">'+Array.from({length:cnt(x)},(_,i)=>'<label class="set"><input type="checkbox" data-c="chk" data-id="'+x.id+'" data-n="'+i+'" '+(i<(x.ds||0)?'checked':'')+'><span>'+(x.sets?'Set '+(i+1):'Done')+'</span></label>').join('')+'</div></div>').join(''):empty('No exercises yet.','Add one to start checking off sets.'))+'<button class="btn pri" data-a="addex" data-d="'+s.date+'">+ Add Exercise</button>'};
V.history=()=>{const k=Object.keys(S.days).sort().reverse();return '<div class="between"><h1 class="ph">History</h1><button class="btn pri sm" data-a="pastday">+ Log a day</button></div>'+(k.length?k.map(row).join(''):empty('No workouts yet.','Your Day 1 starts here.'))};

cm:d=>{let m=UI.cm.m+ +d.v,y=UI.cm.y;if(m<0){m=11;y--}if(m>11){m=0;y++}UI.cm={y:y,m:m};render()},
edlib:d=>openLib(d.id),dellib:d=>ask('Remove this exercise from your library? Past workouts keep their records.',()=>{S.exercises=S.exercises.filter(x=>x.id!==d.id);closeM()}),
goal:d=>openGoal(d.id),delgoal:d=>ask('Delete this goal?',()=>{S.goals=S.goals.filter(x=>x.id!==d.id);closeM()}),
rem:d=>openRem(d.id),delrem:d=>ask('Delete this reminder?',()=>{S.reminders=S.reminders.filter(x=>x.id!==d.id);closeM()}),
notif:()=>{try{Notification.requestPermission().then(()=>render())}catch(e){toast('Notifications are not available here.')}},
export:()=>{const j=JSON.stringify(S,null,2);modal('<h2>Export data</h2><small style="margin-bottom:8px">Copy this JSON or download it. Keep it somewhere safe.</small><textarea id="xj" rows="10" readonly style="font-family:monospace;font-size:12px">'+esc(j)+'</textarea><div class="acts"><button class="btn pri" data-a="copy">Copy</button><button class="btn" data-a="dl">Download file</button><button class="btn" data-a="close">Close</button></div>')},
copy:()=>{const t=$('#xj');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied.'),()=>{document.execCommand('copy');toast('Copied.')})}catch(e){try{document.execCommand('copy');toast('Copied.')}catch(x){toast('Select the text and copy it manually.')}}},
dl:()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#xj').value],{type:'application/json'}));a.download='fitness-tracker-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){toast('Download is blocked here. Use Copy instead.')}},
import:()=>modal('<h2>Import data</h2><small style="margin-bottom:8px">Choose a JSON export or paste it below. This replaces your current data.</small><input type="file" accept=".json,application/json" data-c="ifile" aria-label="JSON file"><textarea id="ij" rows="8" style="margin-top:8px" aria-label="JSON"></textarea><div class="err" id="ie" role="alert"></div><div class="acts"><button class="btn pri" data-a="imgo">Import</button><button class="btn" data-a="close">Cancel</button></div>'),
imgo:()=>{try{const o=JSON.parse($('#ij').value);if(!o||typeof o!=='object'||typeof o.days!=='object'||o.days===null)throw 0;ask('Replace all current data with the imported file?',()=>{S=Object.assign(dflt(),o);S.settings=Object.assign(dflt().settings,o.settings);closeM();toast('Data imported.')},()=>A.import())}catch(e){$('#ie').textContent='That is not a valid fitness tracker export.'}},
reset:()=>ask('This permanently deletes every workout, exercise, goal and reminder. Export first if you want a backup.',()=>{S=dflt();UI.v='dash';closeM();toast('All data reset.')},()=>{$('#m').hidden=true})};
const C={chk:t=>{const e=S.days[S.session.date],x=e.exercises.find(y=>y.id===t.dataset.id),i=+t.dataset.n;x.ds=t.checked?i+1:i;save();render()},
df:t=>{const e=ent(t.dataset.d);delete e._tmp;let v=t.value;if(t.dataset.f==='duration')v=Math.max(0,+v||0);e[t.dataset.f]=v;save();if(t.dataset.f==='status')openDay(t.dataset.d)},
meas:t=>{const f=$('#f-'+t.dataset.k);f.hidden=!t.checked},
excat:t=>{UI.cat=t.value;$('#exl').innerHTML=exList()},pe:t=>{UI.pe=t.value;render()},
plan:t=>{S.plan[t.dataset.k]=t.value.trim();save()},rton:t=>{S.reminders.find(r=>r.id===t.dataset.id).on=t.checked;save()},
gcur:t=>{S.goals.find(g=>g.id===t.dataset.id).cur=Math.max(0,+t.value||0);save();render()},gtype:t=>{$('#gbest').hidden=t.value!=='best'},
set:t=>{S.settings[t.dataset.k]=t.dataset.k==='week'?+t.value:t.value;save();render()},
ifile:t=>{const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#ij').value=r.result};r.readAsText(f)}};
const I={exq:t=>{UI.q=t.value;$('#exl').innerHTML=exList()}};
const err=(f,m)=>{f.querySelector('.err').textContent=m};
const F={ex:f=>{const d=f.dataset.d,id=f.dataset.id,g=n=>f.elements[n],on=n=>g('m_'+n).checked,name=g('name').value.trim();if(!name)return err(f,'Enter an exercise name.');
const o={id:id||uid(),name:name,cat:g('cat').value,notes:g('notes').value.trim()};['sets','reps','dist'].forEach(k=>{o[k]=on(k)?Math.max(0,+g(k).value||0):0});o.dur=on('dur')?Math.round(Math.max(0,+g('dur').value||0)*(g('durU').value==='min'?60:1)):0;
if(!o.sets&&!o.reps&&!o.dur&&!o.dist)return err(f,'Tick a measurement and enter a value above 0.');const e=ent(d);delete e._tmp;
if(id){const i=e.exercises.findIndex(x=>x.id===id);o.ds=e.exercises[i].ds||0;e.exercises[i]=o}else{o.ds=0;e.exercises.push(o)}
if(!S.exercises.some(x=>x.name.toLowerCase()===name.toLowerCase()))S.exercises.push({id:uid(),name:name,cat:o.cat});save();AFTER&&AFTER()},
lib:f=>{const id=f.dataset.id,name=f.elements.name.value.trim(),cat=f.elements.cat.value;if(!name)return err(f,'Enter a name.');if(S.exercises.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return err(f,'That exercise already exists.');
if(id){const x=S.exercises.find(y=>y.id===id);Object.values(S.days).forEach(d=>d.exercises.forEach(e=>{if(e.name.toLowerCase()===x.name.toLowerCase()){e.name=name;e.cat=cat}}));x.name=name;x.cat=cat}else S.exercises.push({id:uid(),name:name,cat:cat});closeM()},
goal:f=>{const id=f.dataset.id,e=f.elements,name=e.name.value.trim(),target=+e.target.value;if(!name)return err(f,'Enter a goal name.');if(!(target>0))return err(f,'Target must be above 0.');if(e.type.value==='best'&&!e.ex.value.trim())return err(f,'Enter the exercise name.');
const g={id:id||uid(),name:name,type:e.type.value,target:target,deadline:e.deadline.value,ex:e.ex.value.trim(),metric:e.metric.value,created:today()};if(id){const o=S.goals.findIndex(x=>x.id===id);g.created=S.goals[o].created;g.cur=S.goals[o].cur;S.goals[o]=g}else S.goals.push(g);closeM()},
rem:f=>{const id=f.dataset.id,e=f.elements,name=e.name.value.trim(),days=[0,1,2,3,4,5,6].filter(i=>e['d'+i].checked);if(!name)return err(f,'Enter a name.');if(!e.time.value)return err(f,'Pick a time.');if(!days.length)return err(f,'Pick at least one day.');
const r={id:id||uid(),name:name,time:e.time.value,days:days,on:true};if(id){const i=S.reminders.findIndex(x=>x.id===id);r.on=S.reminders[i].on;S.reminders[i]=r}else S.reminders.push(r);closeM()}};
document.addEventListener('click',e=>{if(e.target.id==='m'){closeM();return}const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){e.preventDefault();A[t.dataset.a](t.dataset,t)}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-c]');if(t&&C[t.dataset.c])C[t.dataset.c](t)});
document.addEventListener('input',e=>{const t=e.target.closest('[data-i]');if(t&&I[t.dataset.i])I[t.dataset.i](t)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-s]');if(f){e.preventDefault();F[f.dataset.s](f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#m').hidden)closeM()});
const fired={};setInterval(()=>{const n=new Date(),t=pad(n.getHours())+':'+pad(n.getMinutes());S.reminders.forEach(r=>{if(!r.on||r.time!==t||!r.days.includes(n.getDay()))return;const k=r.id+today()+t;if(fired[k])return;fired[k]=1;toast('⏰ '+r.name,true);if('Notification'in window&&Notification.permission==='granted'){try{new Notification(r.name,{body:'Fitness reminder'})}catch(x){}}})},15000);
if(S.session)UI.v='workout';render();
</script></body></html>
